<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700">
  <style>
    text { font-family: 'Helvetica', 'Arial', sans-serif; fill: #0f172a; font-size: 15px; }
    .title { font-size: 24px; font-weight: bold; }
    .layer { fill: #f1f5f9; stroke: #0f172a; stroke-width: 2; rx: 20; ry: 20; }
    .layer-title { font-size: 18px; font-weight: bold; }
    .dependency { stroke: #1d4ed8; stroke-width: 3; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1d4ed8" />
    </marker>
  </defs>

  <text class="title" x="50" y="60">Layered Module Relationship</text>

  <rect class="layer" x="80" y="100" width="740" height="130" />
  <text class="layer-title" x="110" y="130">Presentation Layer</text>
  <text x="110" y="160">• Carbon Dashboard pages (Calls, Prompts, Settings)</text>
  <text x="110" y="185">• Realtime Test Consoles (WebSocket/WebRTC/SIP)</text>
  <text x="110" y="210">• State + API hooks (React Query, Zustand)</text>

  <rect class="layer" x="80" y="260" width="740" height="110" />
  <text class="layer-title" x="110" y="290">API Layer</text>
  <text x="110" y="320">• FastAPI router (`backend/app/api/routes.py`)</text>
  <text x="110" y="345">• Exposes /health /calls /prompts /realtime /appointments /models</text>

  <rect class="layer" x="80" y="400" width="740" height="150" />
  <text class="layer-title" x="110" y="430">Domain Service Layer</text>
  <text x="110" y="455">• CallFlowService orchestrates telephony webhooks &amp; call logs</text>
  <text x="110" y="480">• PromptService + `prompt_builder.py` merge instructions &amp; voice hints</text>
  <text x="110" y="505">• RealtimeService creates OpenAI Realtime sessions</text>
  <text x="110" y="530">• AppointmentService persists JSON records</text>
  <text x="110" y="555">• ModelService / ModelRegistry aggregate provider allowlists</text>

  <rect class="layer" x="80" y="580" width="740" height="110" />
  <text class="layer-title" x="110" y="610">Infrastructure Layer</text>
  <text x="110" y="635">• TelephonyAdapter (Twilio/SIP), TTS engines, OpenAI client</text>
  <text x="110" y="660">• JsonFileRepository → prompts.json / appointments.json / model_allowlist.json</text>

  <line class="dependency" x1="450" y1="230" x2="450" y2="260" />
  <line class="dependency" x1="450" y1="370" x2="450" y2="400" />
  <line class="dependency" x1="450" y1="550" x2="450" y2="580" />
</svg>
