[tool.poetry]
name = "llm-voice-desk-backend"
version = "0.1.0"
description = "Backend service for LLM VoiceDesk"
authors = ["Your Team <team@example.com>"]
readme = "../README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = { extras = ["standard"], version = "^0.29.0" }
pydantic = "^2.7.1"
httpx = "^0.28.1"
pydantic-settings = "^2.2.1"
python-multipart = "^0.0.9"
sqlalchemy = "^2.0.46"
greenlet = ">=3.0,<4"
psycopg2-binary = "^2.9.11"
asyncpg = "^0.30.0"
alembic = "^1.18.3"
google-generativeai = "^0.8.6"
google-genai = ">=1.7,<2.0"
tiktoken = "^0.12.0"
redis = "^7.4.0"
google-auth = "^2.40.0"
websockets = "^15.0.1"
twilio = ">=9,<10"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.6"
ruff = "^0.4.4"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
